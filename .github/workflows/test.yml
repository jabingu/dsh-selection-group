name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A stalled runner should fail fast instead of hanging for the six-hour default:
    # two runs stalled on /alternating/ matrix legs with identical, green-elsewhere code.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      # Run the suite directly rather than through `npm test`: three runs stalled
      # inside the npm wrapper's process tree while the same code passed on the other
      # matrix leg (24 s) and repeated local runs, so the wrapper is the suspect.
      # The spec reporter names the test a stall stops on.
      # `--check` verifies the committed client.js against vendor/ + src/ WITHOUT
      # rewriting it, so the artifact under test can never be repaired by the step
      # that is about to assert on it; drift fails with exit 1.
      - run: node scripts/build.mjs --check
      - run: node --test --test-reporter=spec test/*.test.mjs
