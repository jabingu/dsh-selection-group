name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A stalled runner should fail fast instead of hanging for the six-hour default:
    # two runs stalled on /alternating/ matrix legs with identical, green-elsewhere code.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      # `npm test` rebuilds client.js from vendor/ + src/ and fails when the
      # committed artifact drifted, so a stale bundle can never be released.
      - run: npm test
